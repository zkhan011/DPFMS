services:
  kernel:
    build:
      context: .
      target: kernel
    ports:
      - "55200:55200"
    volumes:
      - kernel-data:/opt/opentcs/data
    restart: unless-stopped

  tiles:
    build:
      context: .
      target: tiles
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      FMS_MOCK_DATA_ENABLED: ${FMS_MOCK_DATA_ENABLED:-true}
      FMS_KERNEL_MODEL_SYNC_ENABLED: ${FMS_KERNEL_MODEL_SYNC_ENABLED:-true}
      FMS_MOCK_UPDATE_INTERVAL_MS: ${FMS_MOCK_UPDATE_INTERVAL_MS:-3000}
      FMS_MAP_PROVIDER: ${FMS_MAP_PROVIDER:-auto}
      FMS_OFFLINE_MAP_ENABLED: ${FMS_OFFLINE_MAP_ENABLED:-true}
      FMS_MAP_DEFAULT_LAT: ${FMS_MAP_DEFAULT_LAT:-24.9857}
      FMS_MAP_DEFAULT_LNG: ${FMS_MAP_DEFAULT_LNG:-55.0273}
      FMS_MAP_DEFAULT_ZOOM: ${FMS_MAP_DEFAULT_ZOOM:-14}
      FMS_OFFLINE_STYLE_URL: ${FMS_OFFLINE_STYLE_URL:-/offline-map/style/style.json}
      FMS_OFFLINE_MIN_ZOOM: ${FMS_OFFLINE_MIN_ZOOM:-5}
      FMS_OFFLINE_MAX_ZOOM: ${FMS_OFFLINE_MAX_ZOOM:-16}
      FMS_OFFLINE_MBTILES_PATH: ${FMS_OFFLINE_MBTILES_PATH:-/opt/dpw-fms/maps/jebel-ali.mbtiles}
      FMS_OFFLINE_TILE_ENDPOINT: ${FMS_OFFLINE_TILE_ENDPOINT:-/api/map/tiles/{z}/{x}/{y}.pbf}
      FMS_OFFLINE_TILE_SERVICE_URL: http://tiles:8090
      FMS_MAP_BBOX: ${FMS_MAP_BBOX:-55.012,24.970,55.044,25.000}
      OPENTCS_WEB_KERNEL_API_BASE_URL: http://kernel:55200/v1
      OPENTCS_WEB_ACCESS_KEY: ${OPENTCS_WEB_ACCESS_KEY:-}
      ROUTING_STRATEGY: ${ROUTING_STRATEGY:-DEFAULT}
      MAP_PROVIDER: ${MAP_PROVIDER:-OSM}
      MAP_ORIGIN_LATITUDE: ${MAP_ORIGIN_LATITUDE:-24.9857}
      MAP_ORIGIN_LONGITUDE: ${MAP_ORIGIN_LONGITUDE:-55.0273}
      MAP_SCALE_METERS_PER_UNIT: ${MAP_SCALE_METERS_PER_UNIT:-0.001}
      MAP_ROTATION_DEGREES: ${MAP_ROTATION_DEGREES:-0}
      MAP_DEFAULT_ZOOM: ${MAP_DEFAULT_ZOOM:-18}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - kernel
      - tiles
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  kernel-data:
